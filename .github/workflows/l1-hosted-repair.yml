name: Temporary L1 hosted repair

on:
  pull_request:
    paths:
      - '.github/workflows/ci-cd.yml'
      - '.github/workflows/l1-hosted-repair.yml'

permissions:
  contents: read

jobs:
  patch-l1:
    if: github.head_ref == 'ci/github-hosted-l1-validation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Replace only the L1 job
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ci-cd.yml')
          text = path.read_text()
          start_marker = '  l1-verify:\n'
          end_marker = '  # ==================================================================\n  # TIER L2: FULL VERIFICATION (MERGE)\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the exact L1 job boundaries')
          if text.find(start_marker, start + 1) != -1:
              raise SystemExit('Multiple L1 job boundaries found; refusing to patch')

          replacement = '''  l1-verify:
    name: "⚡ L1: Verify"
    needs: [classify-pr-impact]
    if: >-
      (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/fix/')) &&
      needs.classify-pr-impact.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ironforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ironforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ironforge_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ironforge_test?schema=public
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_KEY: ''
      SUPABASE_ACCESS_TOKEN: ''
      GH_PAT: ''
      INTERVALS_API_KEY: ''
      INTERVALS_ATHLETE_ID: ''
      FIGMA_API_KEY: ''
      N8N_API_KEY: ''
      N8N_HOST: ''
      PROMPTS_CHAT_API_KEY: ''
      COOLIFY_API_KEY: ''
      SENTRY_AUTH_TOKEN: ''
      SENTRY_ORG: ''
      SENTRY_PROJECT: ''
      PERPLEXITY_API_KEY: ''
      STRAVA_CLIENT_ID: ''
      STRAVA_CLIENT_SECRET: ''
      STRAVA_REFRESH_TOKEN: ''
      GARMIN_EMAIL: ''
      GARMIN_PASSWORD: ''
      DISCORD_BOT_TOKEN: ''
      NOTION_TOKEN: ''
      N8N_CI_TRIAGE_WEBHOOK_URL: ''
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ironforge
        with:
          tier: 'l1'
          skip-managed-services: 'true'
          skip-validation: 'true'
      - name: "🔮 Predictive Failure Analysis"
        run: npx tsx scripts/predict-failures.ts
        continue-on-error: true
      - name: Initialize isolated DB (L1)
        run: npx prisma db push --accept-data-loss
      - name: Cache Turbo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-l1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-l1-${{ runner.os }}-
      - name: Turbo L1 Verify (Differential)
        run: pnpm run ci:l1

'''
          path.write_text(text[:start] + replacement + text[end:])

      - name: Verify repair scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = ".github/workflows/ci-cd.yml"
          grep -Fq 'runs-on: ubuntu-latest' .github/workflows/ci-cd.yml
          grep -Fq 'image: postgres:16-alpine' .github/workflows/ci-cd.yml
          grep -Fq "skip-managed-services: 'true'" .github/workflows/ci-cd.yml

      - name: Commit only the repaired CI workflow
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/ci-cd.yml; then
            echo 'L1 workflow already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/ci-cd.yml
          git diff --cached --quiet && exit 0
          git commit -m 'ci: move L1 validation to GitHub-hosted Postgres'
          git push origin "HEAD:${{ github.head_ref }}"
