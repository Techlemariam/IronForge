# node-version: 22 compliance comment for Governance Guard
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source, Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths-ignore:
      - '.github/workflows/**'
      - '.agent/**'
      - 'docs/**'
      - '**.md'
      - '.snyk'
      - 'docker/Dockerfile.panopticon-runner'
      - 'scripts/app-intelligence.ts'
      - 'scripts/ci/**'

permissions:
  contents: read

jobs:
  snyk:
    timeout-minutes: 30
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: [self-hosted, linux, panopticon, ci, small]
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_IMAGE: ironforge-snyk-scan:${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
      - name: Setup IronForge
        uses: ./.github/actions/setup-ironforge
        with:
          tier: guard
          skip-managed-services: true
          skip-validation: true
      - name: Set up Snyk CLI to check for security issues
        if: env.SNYK_TOKEN != ''
        run: pnpm add --global snyk@latest

        # Runs Snyk Code (SAST) analysis and uploads result into GitHub.
        # Use || true to not fail the pipeline
      - name: Snyk Code test
        if: env.SNYK_TOKEN != ''
        run: |
          set +e
          snyk code test --sarif > snyk-code.sarif.tmp
          snyk_status=$?
          set -e

          if [ -s snyk-code.sarif.tmp ]; then
            mv snyk-code.sarif.tmp snyk-code.sarif
          else
            rm -f snyk-code.sarif.tmp
            echo "Snyk Code did not produce a non-empty SARIF file; continuing without SARIF upload."
          fi

          if [ "$snyk_status" -ne 0 ]; then
            echo "Snyk Code exited with status $snyk_status; continuing so policy is reported by Snyk/GitHub."
          fi

        # Runs Snyk Open Source (SCA) analysis and uploads result to Snyk.
      - name: Snyk Open Source monitor
        if: env.SNYK_TOKEN != ''
        run: snyk monitor --all-projects || true

        # Runs Snyk Infrastructure as Code (IaC) analysis and uploads result to Snyk.
        # Use || true to not fail the pipeline.
      - name: Snyk IaC test and report
        if: env.SNYK_TOKEN != ''
        run: snyk iac test --report || true # || true

      - name: Validate sanitized Docker diagnostics
        if: env.SNYK_TOKEN != ''
        run: node scripts/ci/run-sanitized-diagnostic.mjs --self-test

        # Build the docker image for testing without emitting raw runner or endpoint output.
      - name: Build a Docker image
        if: env.SNYK_TOKEN != ''
        run: |
          node scripts/ci/run-sanitized-diagnostic.mjs \
            --kind docker \
            --label "Snyk Docker build" \
            --timeout-seconds 900 \
            -- docker build --progress=plain -t "$SNYK_IMAGE" .

        # Runs Snyk Container (Container and SCA) analysis and uploads result to Snyk.
      - name: Snyk Container monitor
        if: env.SNYK_TOKEN != ''
        run: snyk container monitor "$SNYK_IMAGE" --file=Dockerfile || true

      - name: Remove run-scoped Snyk image
        if: always() && env.SNYK_TOKEN != ''
        continue-on-error: true
        run: docker image rm --force "$SNYK_IMAGE" >/dev/null 2>&1 || true

        # Push the Snyk Code results into GitHub Code Scanning tab
      - name: Upload result to GitHub Code Scanning
        if: env.SNYK_TOKEN != '' && hashFiles('snyk-code.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif

      - name: Skip Snyk when token is unavailable
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN is unavailable for this event; skipping Snyk scan."
